<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF9" />
      <stop offset="100%" stop-color="#F2F1ED" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCCE1" />
      <stop offset="25%" stop-color="#F7DDE8" />
      <stop offset="50%" stop-color="#C6E2E7" />
      <stop offset="75%" stop-color="#CDE5D9" />
      <stop offset="100%" stop-color="#F2EBCC" />
    </linearGradient>
    <filter id="shadow" x="-5" y="-5" width="860" height="250" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2D3748" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="236" rx="20" fill="url(#bgGrad)" stroke="#FFCCE1" stroke-width="2" filter="url(#shadow)" />

  <!-- Soft Decorative Blobs -->
  <circle cx="780" cy="40" r="90" fill="#FFCCE1" fill-opacity="0.35" />
  <circle cx="820" cy="120" r="70" fill="#C6E2E7" fill-opacity="0.30" />
  <circle cx="730" cy="180" r="55" fill="#CDE5D9" fill-opacity="0.30" />
  <circle cx="40" cy="200" r="60" fill="#F2EBCC" fill-opacity="0.40" />
  <circle cx="20" cy="30" r="45" fill="#F7DDE8" fill-opacity="0.45" />

  <!-- Top Decorative Accent Bar -->
  <rect x="20" y="16" width="160" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Status / Pill Badge -->
  <g transform="translate(40, 36)">
    <rect width="260" height="26" rx="13" fill="#FFCCE1" fill-opacity="0.6" stroke="#FFCCE1" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#2E7D32" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2D3748" letter-spacing="0.5">OPEN FOR RESEARCH &amp; ROLES</text>
  </g>

  <!-- Name -->
  <text x="40" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1E293B" letter-spacing="-0.5">
    Sharu Nethra R
  </text>

  <!-- Professional Headline -->
  <text x="40" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#475569">
    AI/ML Engineer  •  Full-Stack Developer  •  Trustworthy AI &amp; FinTech Research
  </text>

  <!-- Context / Education Pills -->
  <g transform="translate(40, 168)">
    <!-- Pill 1: SRMIST -->
    <rect x="0" y="0" width="225" height="30" rx="8" fill="#C6E2E7" fill-opacity="0.55" stroke="#C6E2E7" stroke-width="1" />
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2D3748">
      🎓 SRMIST Kattankulathur ('28)
    </text>

    <!-- Pill 2: FinTech Honours -->
    <rect x="237" y="0" width="205" height="30" rx="8" fill="#CDE5D9" fill-opacity="0.6" stroke="#CDE5D9" stroke-width="1" />
    <text x="251" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2D3748">
      💎 FinTech Honours • CGPA 9.24
    </text>

    <!-- Pill 3: Key Focus -->
    <rect x="454" y="0" width="230" height="30" rx="8" fill="#F2EBCC" fill-opacity="0.6" stroke="#F2EBCC" stroke-width="1" />
    <text x="468" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2D3748">
      ⚡ Local RAG &amp; Resilient Systems
    </text>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="40" y="218" width="770" height="3" rx="1.5" fill="url(#accentGrad)" />
</svg>
